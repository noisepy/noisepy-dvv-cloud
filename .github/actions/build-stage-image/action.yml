# One stage image, both architectures, from the pixi lock.
#
# Extracted so the pull-request build and the main push build can be separate
# jobs with different permissions without duplicating the steps. GitHub does
# not allow expressions in `permissions:`, so a single job cannot hold
# `packages: write` only when it actually pushes.
name: Build stage image
description: Build one stage image for linux/amd64 and linux/arm64 from the pixi lock.

inputs:
  stage:
    description: correlate | dvv
    required: true
  push:
    description: "'true' to publish to ghcr, 'false' to build only"
    required: true
  token:
    description: Registry token. Only needed when push is 'true'.
    required: false
    default: ''
  smoke_import:
    description: Python run inside the built image to prove the stack loads.
    required: true

runs:
  using: composite
  steps:
    # arm64 runs under emulation. pixi downloads prebuilt aarch64 conda
    # packages rather than compiling, so QEMU only pays for extraction.
    - uses: docker/setup-qemu-action@v3
      with:
        platforms: arm64
    - uses: docker/setup-buildx-action@v3

    - if: inputs.push == 'true'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.token }}

    - uses: docker/metadata-action@v5
      id: meta
      with:
        images: ghcr.io/${{ github.repository }}
        tags: |
          type=sha,prefix=${{ inputs.stage }}-,format=short
          type=raw,value=${{ inputs.stage }}-latest,enable={{is_default_branch}}

    - uses: docker/build-push-action@v6
      with:
        context: .
        file: docker/Dockerfile.${{ inputs.stage }}
        platforms: linux/amd64,linux/arm64
        push: ${{ inputs.push }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha,scope=${{ inputs.stage }}
        cache-to: type=gha,mode=max,scope=${{ inputs.stage }}

    # A build is not a run, and this step exists because that distinction cost
    # two failed Batch jobs. The first pixi images built clean on both arches
    # and then died at task start: the environment's libicui18n wanted
    # CXXABI_1.3.15 and the runtime base ships GCC 12's libstdc++. Nothing in a
    # `docker build` can catch that. So CI now executes the real entrypoint on
    # both architectures -- arm64 under QEMU -- and the image has to import its
    # own stack and exit 0 before anything is published.
    - name: Run the entrypoint on both architectures
      shell: bash
      run: |
        set -euo pipefail
        for plat in amd64 arm64; do
          tag="smoke-${{ inputs.stage }}-$plat"
          # single-platform so it can be --load-ed; the layers are already cached
          docker buildx build --platform "linux/$plat" --load \
            --cache-from "type=gha,scope=${{ inputs.stage }}" \
            -f "docker/Dockerfile.${{ inputs.stage }}" -t "$tag" .
          echo "--- $plat: dvv-cloud --help through the real ENTRYPOINT ---"
          docker run --rm --platform "linux/$plat" "$tag" --help > /dev/null
          echo "--- $plat: the stage's own imports ---"
          docker run --rm --platform "linux/$plat" --entrypoint /bin/bash "$tag" \
            /shell-hook.sh python -c "${{ inputs.smoke_import }}"
        done
