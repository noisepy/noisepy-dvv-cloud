# One stage image, both architectures, from the pixi lock.
#
# Extracted so the pull-request build and the main push build can be separate
# jobs with different permissions without duplicating the steps. GitHub does
# not allow expressions in `permissions:`, so a single job cannot hold
# `packages: write` only when it actually pushes.
name: Build stage image
description: Build one stage image for linux/amd64 and linux/arm64 from the pixi lock.

inputs:
  stage:
    description: correlate | dvv
    required: true
  push:
    description: "'true' to publish to ghcr, 'false' to build only"
    required: true
  token:
    description: Registry token. Only needed when push is 'true'.
    required: false
    default: ''
  smoke_import:
    description: Python run inside the built image to prove the stack loads.
    required: true

runs:
  using: composite
  steps:
    # arm64 runs under emulation. pixi downloads prebuilt aarch64 conda
    # packages rather than compiling, so QEMU only pays for extraction.
    - uses: docker/setup-qemu-action@v3
      with:
        platforms: arm64
    - uses: docker/setup-buildx-action@v3

    # BUILD AND RUN BEFORE PUBLISHING. The order is the point. A build cannot
    # catch a dynamic linking failure: the first pixi images built clean on both
    # arches and then died at Batch task start because the environment's
    # libicui18n wanted CXXABI_1.3.15 and the runtime base ships GCC 12's
    # libstdc++. So the real entrypoint is executed on both architectures --
    # arm64 under QEMU -- and this step sits BEFORE the publish step, so a
    # failure here means nothing reaches ghcr. An earlier version of this action
    # ran the same check after the push, which proved nothing about the tags
    # people pull.
    #
    # Single-platform builds because --load cannot take a multi-platform image.
    # They populate the layer cache the publish step then reuses.
    - name: Build and run the entrypoint on both architectures
      shell: bash
      run: |
        set -euo pipefail
        for plat in amd64 arm64; do
          tag="smoke-${{ inputs.stage }}-$plat"
          docker buildx build --platform "linux/$plat" --load \
            --cache-from "type=gha,scope=${{ inputs.stage }}" \
            --cache-to "type=gha,mode=max,scope=${{ inputs.stage }}" \
            -f "docker/Dockerfile.${{ inputs.stage }}" -t "$tag" .
          echo "--- $plat: dvv-cloud --help through the real ENTRYPOINT ---"
          docker run --rm --platform "linux/$plat" "$tag" --help > /dev/null
          echo "--- $plat: the stage's own imports ---"
          docker run --rm --platform "linux/$plat" --entrypoint /bin/bash "$tag" \
            /shell-hook.sh python -c "${{ inputs.smoke_import }}"
        done

    - if: inputs.push == 'true'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.token }}

    - uses: docker/metadata-action@v5
      id: meta
      with:
        images: ghcr.io/${{ github.repository }}
        tags: |
          type=sha,prefix=${{ inputs.stage }}-,format=short
          type=raw,value=${{ inputs.stage }}-latest,enable={{is_default_branch}}

    - name: Publish the multi-arch manifest
      uses: docker/build-push-action@v6
      with:
        context: .
        file: docker/Dockerfile.${{ inputs.stage }}
        platforms: linux/amd64,linux/arm64
        push: ${{ inputs.push }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        # cache-to lives on the smoke builds above, which run first
        cache-from: type=gha,scope=${{ inputs.stage }}
