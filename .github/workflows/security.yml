# Automated secret scanning. The 2026-09-11 audit that motivated this was run
# by hand; a snapshot is not a control. Two scanners on purpose:
#
#   detect-secrets  current files, entropy + 27 rule plugins, baseline-diffed
#                   so a known-safe string does not fail every future PR
#   gitleaks        FULL HISTORY, every commit on the pushed ref -- catches a
#                   secret that was committed and then removed, which a
#                   working-tree scan cannot see
#
# Neither needs a licence or an external service. gitleaks is pinned and
# fetched as a release binary rather than via gitleaks-action, which requires
# a GITLEAKS_LICENSE for organisation repos.
name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # history does not change on its own, but the rule sets do
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # gitleaks needs real history, not a depth-1 clone
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: detect-secrets (tracked files, vs baseline)
        run: |
          python -m pip install --quiet detect-secrets==1.5.0
          git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline

      - name: gitleaks (full history)
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --no-banner --redact --verbose .

  # The image must be ANONYMOUSLY pullable or AWS Batch on Fargate cannot start
  # a task from it. Informational on PRs; a real failure on main, where the
  # published image is what a campaign would launch.
  image-pullable:
    runs-on: ubuntu-latest
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v5
      - run: python scripts/check_image_public.py
