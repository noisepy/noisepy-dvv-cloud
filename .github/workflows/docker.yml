# Both stage images, built from the pixi lock for amd64 AND arm64.
#
# arm64 exists so Batch can move to Fargate Graviton, which is cheaper per vCPU
# than x86 for the same shape. It only became possible when the images stopped
# being pip-on-python:3.10-slim: obspy publishes no linux/aarch64 wheel on PyPI
# at any version through 1.5.1, but conda-forge ships one, so building from the
# lock gets arm64 without touching a line of NoisePy.
#
# PRs build both arches without pushing. Before this, an arm64 break could only
# be discovered on main, after the tag everyone pulls had already moved.
name: docker

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        stage: [correlate, dvv]
    steps:
      - uses: actions/checkout@v5
      # arm64 runs under emulation here. pixi downloads prebuilt aarch64 conda
      # packages rather than compiling, so QEMU only pays for extraction.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=${{ matrix.stage }}-,format=short
            type=raw,value=${{ matrix.stage }}-latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.stage }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.stage }}
          cache-to: type=gha,mode=max,scope=${{ matrix.stage }}
