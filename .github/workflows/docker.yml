# Both stage images, built from the pixi lock for amd64 AND arm64.
#
# arm64 exists so Batch can move to Fargate Graviton, which is cheaper per vCPU
# than x86 for the same shape. It only became possible when the images stopped
# being pip-on-python:3.10-slim: obspy publishes no linux/aarch64 wheel on PyPI
# at any version through 1.5.1, but conda-forge ships one, so building from the
# lock gets arm64 without touching a line of NoisePy.
#
# Two jobs rather than one because `permissions:` takes no expressions, and a
# pull-request build has no business holding `packages: write` when it never
# pushes. They share .github/actions/build-stage-image so the build itself is
# defined once.
#
# PRs build both arches without pushing. Before this, an arm64 break could only
# be discovered on main, after the tag every Fargate task pulls had moved.
name: docker

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # verify only: no registry credentials, no write scope
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - stage: correlate
            smoke_import: "import noisepy.seis, obspy, noisepy_dvv_cloud.correlate"
          - stage: dvv
            smoke_import: "import codameter, noisepy_dvv_cloud.dvv"
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/build-stage-image
        with:
          stage: ${{ matrix.stage }}
          push: 'false'
          smoke_import: ${{ matrix.smoke_import }}

  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - stage: correlate
            smoke_import: "import noisepy.seis, obspy, noisepy_dvv_cloud.correlate"
          - stage: dvv
            smoke_import: "import codameter, noisepy_dvv_cloud.dvv"
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/build-stage-image
        with:
          stage: ${{ matrix.stage }}
          push: 'true'
          token: ${{ secrets.GITHUB_TOKEN }}
          smoke_import: ${{ matrix.smoke_import }}
