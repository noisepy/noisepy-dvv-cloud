[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "noisepy-dvv-cloud"
version = "0.1.0"
description = "Cloud-scale single-station dv/v monitoring: NoisePy correlations on Fargate Spot, Parquet on S3, codameter dv/v"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Marine Denolle", email = "mdenolle@uw.edu" }]
requires-python = ">=3.10,<3.11"
dependencies = [
    "noisepy-seis",
    "noisepy-seis-io==0.3.5",
    "codameter[aws]",
    "pyarrow>=14",
    "pandas",
    "numpy",
    "boto3",
    "s3fs",
    "fsspec",
    "datetimerange",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "pre-commit"]

[project.scripts]
dvv-cloud = "noisepy_dvv_cloud.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/noisepy_dvv_cloud"]

[tool.ruff]
line-length = 100
