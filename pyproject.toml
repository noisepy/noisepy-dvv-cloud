[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "noisepy-dvv-cloud"
version = "0.1.0"
description = "Cloud-scale single-station dv/v monitoring: NoisePy correlations on Fargate Spot, Parquet on S3, codameter dv/v"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Marine Denolle", email = "mdenolle@uw.edu" }]
requires-python = ">=3.10,<3.11"
# Core stays minimal: noisepy-seis pins pandas<2 while codameter needs
# pandas>=2, so the two stages CANNOT share an environment. Each container
# installs exactly one of the extras below; code imports them lazily.
dependencies = [
    "pyarrow>=12",
    "pandas",
    "numpy",
    "boto3",
    "s3fs",
    "fsspec",
    "pyyaml",
]

[project.optional-dependencies]
# boto3 pinned to match noisepy-seis's aiobotocore==2.5.2; without it pip's
# resolver backtracks for hours and eventually fails (see Dockerfile.correlate)
correlate = ["noisepy-seis==0.9.93", "noisepy-seis-io==0.3.5", "boto3==1.26.161", "datetimerange"]
# PINNED, not a range: the dv/v sign convention is version-dependent at the
# 0.4 boundary (codameter >= 0.4 no longer needs the negation -- see the
# version-aware branch in dvv.py). A floating range silently flips the sign of
# every product between a smoke run and a campaign run.
dvv = ["codameter[aws]==0.4.0"]
dev = ["pytest", "ruff", "pre-commit"]

[project.scripts]
dvv-cloud = "noisepy_dvv_cloud.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/noisepy_dvv_cloud"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Pin the ruleset instead of inheriting whatever the installed ruff defaults to.
# The pre-commit hook is ruff v0.8.4 and the dvv environment currently resolves
# 0.16.3; without this, `ruff check .` reports 19 errors on a tree the hook
# passes clean, and every one of them is rule-set drift rather than a defect.
# These four are ruff's own documented default.
select = ["E4", "E7", "E9", "F"]

# --------------------------------------------------------------------------- #
#  pixi
#
#  The two stages cannot share an environment (noisepy-seis pins pandas<2,
#  codameter needs pandas>=2), so they are two pixi environments over the two
#  extras above. pixi maps each name in [project.optional-dependencies] to a
#  feature of the same name; the environments below compose them. They solve
#  independently -- do NOT put them in a shared solve-group.
#
#      pixi run -e correlate ...     # stage 1
#      pixi run -e dvv ...           # stage 2
# --------------------------------------------------------------------------- #

[tool.pixi.workspace]
channels = ["conda-forge"]
# osx-arm64 = the laptop; linux-64 = what the Batch images run on (obspy ships
# no linux/aarch64 wheels, so linux-aarch64 stays off the list until the
# seisfetch migration removes obspy from the correlate stage).
platforms = ["osx-arm64", "linux-64"]

[tool.pixi.dependencies]
# Intersection of noisepy (<3.11) and codameter (>=3.10).
python = "3.10.*"

[tool.pixi.pypi-dependencies]
noisepy-dvv-cloud = { path = ".", editable = true }

# awscli lives in its own environment on purpose. conda-forge's awscli pulls
# ruamel-yaml 0.19, and noisepy-seis pins pydantic-yaml==1.0 which caps
# ruamel-yaml <0.18 -- putting it in the correlate environment makes the solve
# unsatisfiable. Operator tooling is not a dependency of either stage.
[tool.pixi.feature.ops.dependencies]
awscli = "*"

# pygmt is separate for the same reason awscli is: GMT is a C library with its
# own data stack (netCDF, GDAL), and it has no business in the solve for either
# processing stage. The station map is written once to a PNG and the dashboard
# embeds it, so `map` never has to satisfy codameter or noisepy.
[tool.pixi.feature.map.dependencies]
pygmt = "*"

# The cost model is tooling, run by hand when the pricing or the measured
# anchors move. scipy is for the KDTree station geometry, matplotlib for the
# figures, tabulate for pandas' markdown tables -- none of which belongs in a
# processing container.
[tool.pixi.feature.tools.dependencies]
scipy = "*"
matplotlib = "*"
tabulate = "*"

[tool.pixi.environments]
correlate = ["correlate", "dev"]
dvv = ["dvv", "dev"]
ops = ["ops"]
map = ["map"]
tools = ["tools"]

# Sanity checks -- run both after any dependency change. `verify-dvv` prints the
# codameter version because the sign convention depends on it.
[tool.pixi.feature.correlate.tasks]
verify-correlate = "python -c \"import noisepy.seis, noisepy.seis.io, pandas; print('correlate ok | pandas', pandas.__version__)\""

[tool.pixi.feature.dvv.tasks]
verify-dvv = "python -c \"import codameter, pandas; print('dvv ok | codameter', codameter.__version__, '| pandas', pandas.__version__)\""
