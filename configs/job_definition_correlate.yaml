# aws batch register-job-definition --no-cli-pager --cli-input-yaml file://configs/job_definition_correlate.yaml
jobDefinitionName: dvvcloud2026_correlate
type: container
parameters:
  scratch: /tmp/noisepy_scratch
containerProperties:
  image: ghcr.io/noisepy/noisepy-dvv-cloud:correlate-latest   # pin correlate-<sha> for a campaign
  jobRoleArn: ''         # [REQUIRED] needs s3:PutObject/GetObject on the output bucket
  executionRoleArn: ''   # [REQUIRED] AmazonECSTaskExecutionRolePolicy (pull image + logs)
  command:
    - correlate
    - "--stations"
    - Ref::stations
    - "--start"
    - Ref::start
    - "--end"
    - Ref::end
    - "--output"
    - Ref::output
    - "--scratch"
    - Ref::scratch
  resourceRequirements:
    # 2 vCPU: NoisePy's thread pool measured only ~1.7x speedup on 4 threads
    # (GIL-bound ifft loop), so small tasks x more of them is cheaper.
    # 16 GB: whiten() transiently holds ~1 GB/channel (float64 + a dead
    # 433 MB allocation upstream); 4-station shards peak ~12 GB.
    # Revisit both after the smoke test.
    - { value: '2', type: VCPU }
    - { value: '16384', type: MEMORY }
  ephemeralStorage:
    sizeInGiB: 100   # scratch numpy stores before Parquet export
  networkConfiguration:
    assignPublicIp: ENABLED
  fargatePlatformConfiguration:
    platformVersion: LATEST
  runtimePlatform:
    operatingSystemFamily: LINUX
    cpuArchitecture: X86_64
timeout:
  attemptDurationSeconds: 86400
platformCapabilities: [FARGATE]
retryStrategy:
  attempts: 10
  evaluateOnExit:
    - { action: "RETRY", onStatusReason: "Your Spot Task was interrupted." }
    - { action: "EXIT", onReason: "*" }
